name: Snap test and publish to a branch on PR

on:
  workflow_call:
    secrets:
      SNAP_STORE_TOKEN_EDGE:
        required: true

jobs:
  discover-snaps:
    uses: ./.github/workflows/snaps-discover.yaml

  build-snaps:
    name: Build snap | ${{ matrix.snap.name }}
    needs: discover-snaps
    strategy:
      fail-fast: false
      matrix:
        snap: ${{ fromJSON(needs.discover-snaps.outputs.snaps) }}
    uses: canonical/data-platform-workflows/.github/workflows/build_snap.yaml@v49.0.2
    with:
      path-to-snap-project-directory: ${{ matrix.snap.path }}
      artifact-prefix: packed-snap-${{ matrix.snap.name }}
    permissions:
      actions: read # Needed for GitHub API call to get workflow version
      contents: read

  test-snaps:
    name: Smoke tests | ${{ matrix.snap.name }}
    runs-on: ubuntu-latest
    needs:
      - discover-snaps
      - build-snaps
    strategy:
      fail-fast: false
      matrix:
        snap: ${{ fromJSON(needs.discover-snaps.outputs.snaps) }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install tox
        run: python3 -m pip install tox

      - name: Download snap artifact
        uses: actions/download-artifact@v6
        with:
          pattern: packed-snap-${{ matrix.snap.name }}-*
          merge-multiple: true

      - name: Smoke Tests
        working-directory: ${{ matrix.snap.path }}
        run: tox run -e smoke

  publish-snaps:
    name: Publish snap to PR branch | ${{ matrix.snap.name }}
    needs:
      - discover-snaps
      - build-snaps
      - test-snaps
    strategy:
      fail-fast: false
      matrix:
        snap: ${{ fromJSON(needs.discover-snaps.outputs.snaps) }}
    uses: canonical/data-platform-workflows/.github/workflows/release_snap_pr.yaml@v49.0.2
    with:
      track: 8
      path-to-snap-project-directory: ${{ matrix.snap.path }}
      artifact-prefix: packed-snap-${{ matrix.snap.name }}
    secrets:
      snap-store-token: ${{ secrets.SNAP_STORE_TOKEN_EDGE }}
    permissions:
      actions: read   # Needed for GitHub API call to get workflow version
      contents: read
