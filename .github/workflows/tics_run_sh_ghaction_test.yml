name: TICS run self-hosted test

on:
  schedule:
    - cron: "0 2 * * 6" # Every Saturday 2:00 AM UTC
  workflow_dispatch: # Allows manual triggering
    inputs:
      target_branch:
        description: "Branch to run TICS on"
        required: true
        default: "8/edge"
        type: choice
        options:
          - 6/edge
          - 8/edge

jobs:
  tics-build:
    runs-on: [self-hosted, linux, amd64, tiobe, noble]

    steps:
      - name: Checkout the project
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch || github.ref_name }}

      - name: Install tox & poetry
        run: |
          pipx ensurepath
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          pipx install tox poetry

      - name: Set up python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "poetry"

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y build-essential python3-dev libldap-dev libsasl2-dev libldap2-dev libssl-dev
          poetry install

      - name: Run tox unit tests to create coverage.xml
        run: tox run -e unit

      - name: move results to necessary folder for TICS
        run: |
          mkdir .cover
          mv coverage.xml .cover/coverage.xml

      - name: Compute TICS project name
        id: tics_project
        run: |
          BRANCH="${{ inputs.target_branch || github.ref_name }}"
          PROJECT="mongo-single-kernel-library_${BRANCH//\//_}"
          echo "project=${PROJECT}" >> "$GITHUB_OUTPUT"

      - name: Run TICS analysis with github-action
        uses: tiobe/tics-github-action@v3
        with:
          mode: qserver
          project: ${{ steps.tics_project.outputs.project }}
          branchdir: .
          viewerUrl: https://canonical.tiobe.com/tiobeweb/TICS/api/cfg?name=default
          ticsAuthToken: ${{ secrets.TICSAUTHTOKEN }}
          installTics: true
