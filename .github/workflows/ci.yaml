name: Run tests

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    secrets:
      AWS_ACCESS_KEY:
        required: true
      AWS_SECRET_KEY:
        required: true
      GCP_ACCESS_KEY:
        required: true
      GCP_SECRET_KEY:
        required: true
      GCS_SERVICE_ACCOUNT:
        required: true
      CHARMHUB_TOKEN:
        required: true

jobs:
  pre-commit:
    name: Run pre-commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install tox & poetry
        run: |
          pipx install tox poetry
      - name: Set up python environment
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "poetry"
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y  build-essential python3-dev libldap-dev libsasl2-dev
      - name: Install pre-commit
        run: |
          poetry install
          poetry run pre-commit install
      - name: Run pre-commit hooks
        run: |
          poetry run pre-commit run --all-files
    permissions:
      contents: read

  check-pyproject-dynamic-versioning:
    name: Poetry dynamic versioning check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install deps
        run: sudo snap install yq
      - name: Check versioning
        run: |
          VERSION=$(yq -p toml -oy '.tool.poetry.version' ./pyproject.toml)
          DYNAMIC_FIELDS=$(yq -p toml -oc '.project.dynamic'  ./pyproject.toml)
          if [[ $VERSION != *"0.0.0"* ]]
          then
            exit 1
          fi
          if [[ $DYNAMIC_FIELDS != *"version"* ]]
          then
            exit 1
          fi
    permissions:
      contents: read

  actionlint:
    name: Lint .github/workflows/
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install actionlint
        id: install
        run: |
          curl -O https://raw.githubusercontent.com/rhysd/actionlint/main/.github/actionlint-matcher.json
          echo "::add-matcher::actionlint-matcher.json"
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
      - name: Run actionlint
        run: |
          "${EXECUTABLE}" -color
        env:
          EXECUTABLE: ${{ steps.install.outputs.executable }}
    permissions:
      contents: read

  lint-workflows:
    name: Lint .github/workflows/
    uses: canonical/data-platform-workflows/.github/workflows/lint_workflows.yaml@50.2.1
    permissions:
      contents: read

  lib-check:
    name: Check libraries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check libs
        uses: canonical/charming-actions/check-libraries@2.7.0
        continue-on-error: true
        with:
          charm-path: ./single_kernel_mongo/
          credentials: ${{ secrets.CHARMHUB_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      pull-requests: write
      contents: read

  tox-lint:
    name: tox run -e lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install tox & poetry
        run: |
          pipx install tox poetry
      - name: Set up python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "poetry"
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y  build-essential python3-dev libldap-dev libsasl2-dev
      - name: Run linters
        run: tox run -e lint
    permissions:
      contents: read

  unit-test:
    strategy:
      matrix:
        env:
          - lxd
          - microk8s
    name: Unit test charm (${{ matrix.env }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install tox & poetry
        run: |
          pipx install tox poetry
      - name: Set up python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "poetry"
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y  build-essential python3-dev libldap-dev libsasl2-dev
      - name: Run tests
        run: tox run -e unit-${{ matrix.env }}
    permissions:
      contents: read

  build:
    strategy:
      matrix:
        path:
          - tests/charms/mongodb_test_charm
          - tests/charms/mongodb_k8s_test_charm
          - tests/charms/mongos_test_charm
          - tests/charms/mongos_k8s_test_charm
    name: Build Test charm | ${{ matrix.path }}
    uses: ./.github/workflows/build_test_charms.yaml
    with:
      path-to-charm-directory: ${{ matrix.path }}
      artifact-prefix: packed-charm
      cache: true
    permissions:
      contents: read

  build-helpers:
    strategy:
      matrix:
        path:
          - tests/integration/applications/client_relations_charm
          - tests/integration/applications/continuous_write_charm
          - tests/integration/applications/mongos_client_charm
    name: Build charm | ${{ matrix.path }}
    uses: canonical/data-platform-workflows/.github/workflows/build_charm.yaml@v50.2.1
    with:
      path-to-charm-directory: ${{ matrix.path }}
      artifact-prefix: packed-charm
      cache: true
    permissions:
      contents: read

  integration-test:
    name: Integration test charm
    needs:
      - tox-lint
      - unit-test
      - build
      - build-helpers
    uses: ./.github/workflows/integration_test.yaml
    with:
      artifact-prefix: ${{ needs.build.outputs.artifact-prefix }}
    secrets:
      AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
      AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
      GCP_ACCESS_KEY: ${{ secrets.GCP_ACCESS_KEY }}
      GCP_SECRET_KEY: ${{ secrets.GCP_SECRET_KEY }}
      GCS_SERVICE_ACCOUNT: ${{ secrets.GCS_SERVICE_ACCOUNT }}
    permissions:
      contents: write # Needed for Allure Report
