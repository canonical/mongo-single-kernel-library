name: Run tests

on:
  pull_request:
  schedule:
    - cron: "53 0 * * *" # Daily at 00:53 UTC
  workflow_dispatch:
  workflow_call:

jobs:
  pre-commit:
    name: Run pre-commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install tox & poetry
        run: |
          pipx install tox poetry
      - name: Set up python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "poetry"
      - name: Install pre-commit
        run: |
          poetry install
          poetry run pre-commit install
      - name: Run pre-commit hooks
        run: |
          poetry run pre-commit run --all-files

  actionlint:
    name: Lint .github/workflows/
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install actionlint
        id: install
        run: |
          curl -O https://raw.githubusercontent.com/rhysd/actionlint/main/.github/actionlint-matcher.json
          echo "::add-matcher::actionlint-matcher.json"
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
      - name: Run actionlint
        run: |
          '${{ steps.install.outputs.executable }}' -color

  lib-check:
    name: Check libraries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check libs
        uses: canonical/charming-actions/check-libraries@2.7.0
        with:
          charm-path: ./single_kernel_mongo/
          credentials: ${{ secrets.CHARMHUB_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      pull-requests: write

  tox-lint:
    name: tox run -e lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install tox & poetry
        run: |
          pipx install tox poetry
      - name: Set up python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "poetry"
      - name: Run linters
        run: tox run -e lint

  unit-test:
    name: Unit test charm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install tox & poetry
        run: |
          pipx install tox poetry
      - name: Set up python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "poetry"
      - name: Run tests
        run: tox run -e unit

  build:
    name: Build test charms
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        path:
          - tests/charms/mongodb_test_charm
          - tests/charms/mongodb_k8s_test_charm
          - tests/charms/mongos_test_charm
          - tests/charms/mongos_k8s_test_charm
    steps:
      - name: Install CLI
        run: pipx install git+https://github.com/canonical/data-platform-workflows@v31.1.1#subdirectory=python/cli
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install tox & poetry
        shell: bash
        run: |
          pipx install tox poetry
          pipx inject poetry poetry-plugin-export
      - name: Set up environment
        run: |
          sudo snap install lxd
          # shellcheck disable=SC2078
          # (shellcheck sees it as constant, but GitHub Actions expression is not constant between workflow runs)
          sudo adduser "$USER" lxd
          # `newgrp` does not work in GitHub Actions; use `sudo --user` instead
          sudo --user "$USER" --preserve-env --preserve-env=PATH -- env -- lxd waitready
          sudo --user "$USER" --preserve-env --preserve-env=PATH -- env -- lxd init --auto
          # Workaround for Docker & LXD on same machine
          sudo iptables -F FORWARD
          sudo iptables -P FORWARD ACCEPT

          sudo snap install charmcraft --classic
          pipx install charmcraftcache
      - name: Set up python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'poetry'
      - name: Update lib and build charm
        shell: bash
        run: |
          sudo --user "$USER" --preserve-env --preserve-env=PATH -- env -- bash scripts/build_lib_for_integration.sh ${{ matrix.path }}
        env:
          CI_CACHE: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute path in artifact
        id: path-in-artifact
        run: compute-path-in-artifact '${{ matrix.path }}'
      - name: Upload charm
        uses: actions/upload-artifact@v4
        with:
          name: packed-charm-${{ steps.path-in-artifact.outputs.path }}
          path: |
            ${{ matrix.path }}/*.charm
            .empty
          if-no-files-found: error

  build-helpers:
    strategy:
      matrix:
        path:
          - tests/integration/applications/client_relations_charm
          - tests/integration/applications/continuous_write_charm
          - tests/integration/applications/mongos_client_charm
    name: Build charm | ${{ matrix.path }}
    uses: canonical/data-platform-workflows/.github/workflows/build_charm.yaml@v30.2.0
    with:
      path-to-charm-directory: ${{ matrix.path }}
      cache: false

  integration-test:
    name: Integration test charm
    needs:
      - tox-lint
      - unit-test
      - build
      - build-helpers
    uses: ./.github/workflows/integration_test.yaml
    with:
      artifact-prefix: packed-charm
    secrets: inherit
    permissions:
      contents: write  # Needed for Allure Report
