name: Build Test Charms

on:
  workflow_call:
    inputs:
      cache:
        description: Whether to use cache for faster builds
        default: true
        type: boolean
      artifact-prefix:
        description: Charm packages are uploaded to GitHub artifacts beginning with this prefix
        default: packed-charm
        type: string
      path-to-charm-directory:
        description: Relative path to charm directory from repository directory
        default: .
        type: string
    outputs:
      artifact-prefix:
        description: Charm packages are uploaded to GitHub artifacts beginning with this prefix
        value: ${{ inputs.artifact-prefix }}

jobs:
  collect-platforms:
    name: Collect platforms for charm | ${{ inputs.path-to-charm-directory }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install CLI
        run: pipx install git+https://github.com/canonical/data-platform-workflows@v50.2.1#subdirectory=_cli
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Collect charm platforms to build from charmcraft.yaml
        id: collect
        run: collect-charm-platforms --directory="${INPUTS_PATH_TO_CHARM_DIRECTORY}"
        env:
          INPUTS_PATH_TO_CHARM_DIRECTORY: ${{ inputs.path-to-charm-directory }}
    outputs:
      platforms: ${{ steps.collect.outputs.platforms }}
    permissions:
      contents: read
  build:
    needs: collect-platforms
    strategy:
      matrix:
        platform: ${{ fromJSON(needs.collect-platforms.outputs.platforms) }}
    timeout-minutes: 120
    name: "Build test charm ${{ inputs.path-to-charm-directory }} | ${{ matrix.platform.name }}"
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Install CLI
        run: pipx install git+https://github.com/canonical/data-platform-workflows@v50.2.1#subdirectory=_cli
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install tox & poetry
        shell: bash
        run: |
          pipx install tox poetry
          pipx inject poetry poetry-plugin-export
      - name: Set up environment
        run: |
          sudo snap install lxd
          # shellcheck disable=SC2078
          # (shellcheck sees it as constant, but GitHub Actions expression is not constant between workflow runs)
          sudo adduser "$USER" lxd
          # `newgrp` does not work in GitHub Actions; use `sudo --user` instead
          sudo --user "$USER" --preserve-env --preserve-env=PATH -- env -- lxd waitready
          sudo --user "$USER" --preserve-env --preserve-env=PATH -- env -- lxd init --auto
          # Workaround for Docker & LXD on same machine
          sudo iptables -F FORWARD
          sudo iptables -P FORWARD ACCEPT

          sudo snap install charmcraft --classic
          pipx install charmcraftcache
          sudo apt update
          sudo apt install -y  build-essential python3-dev libldap-dev libsasl2-dev
      - name: Set up python environment
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "poetry"
      - name: Update lib and build charm
        shell: bash
        run: |
          sudo --user "$USER" --preserve-env --preserve-env=PATH -- env -- bash scripts/build_lib_for_integration.sh --charm "${INPUTS_PATH_TO_CHARM_DIRECTORY}" --platform ${{ matrix.platform.name }}
        env:
          CI_CACHE: ${{ inputs.cache }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUTS_PATH_TO_CHARM_DIRECTORY: ${{ inputs.path-to-charm-directory }}
      - run: touch .empty
      - name: Compute path in artifact
        id: path-in-artifact
        run: compute-path-in-artifact "${INPUTS_PATH_TO_CHARM_DIRECTORY}"
        env:
          INPUTS_PATH_TO_CHARM_DIRECTORY: ${{ inputs.path-to-charm-directory }}
      - name: Upload charm
        uses: actions/upload-artifact@v7
        with:
          name: packed-charm-${{ steps.path-in-artifact.outputs.path }}--platform-${{ matrix.platform.name_in_artifact }}
          path: |
            ${{ inputs.path-to-charm-directory }}/*.charm
            .empty
          include-hidden-files: true # For `.empty`
          if-no-files-found: error
    permissions:
      contents: read
