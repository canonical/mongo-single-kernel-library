name: Bump dependent charm versions

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      base_branch:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
      base_branch:
        required: true
        type: string

jobs:
  update-dependent-charms:
    name: Open PRs in dependent charm repos
    runs-on: ubuntu-latest

    strategy:
      matrix:
        repo:
          - mongodb-operator
          #- canonical/mongodb-k8s-operator
          #- canonical/mongos-k8s-operator
          #- canonical/mongos-operator

    permissions:
      contents: write
      pull-requests: write

    env:
      VERSION: ${{ inputs.version }}
      BASE_BRANCH: ${{ inputs.base_branch }}
      DEP_NAME: mongo-charms-single-kernel
      GH_TOKEN: ${{ secrets.PAT }}
      PR_BRANCH: "bump-mongo-charms-single-kernel-${{ inputs.version }}2"

    steps:
      - name: Install CLI
        run: pipx install git+https://github.com/canonical/data-platform-workflows@v31.1.1#subdirectory=python/cli

      - name: Checkout target repo
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BASE_BRANCH }}

      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Checkout repo
        run: |
          git clone https://github.com/canonical/${{ matrix.repo }}.git
          cd ${{ matrix.repo }}
          git checkout ${{ env.BASE_BRANCH }}
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/canonical/${{ matrix.repo }}.git

      - name: Install tox & poetry
        run: |
          pipx ensurepath
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          pipx install tox poetry

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "poetry"

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y build-essential python3-dev libldap-dev libsasl2-dev

      - name: Update dependency version in pyproject.toml
        working-directory: ${{ matrix.repo }}
        run: |
          poetry remove "${DEP_NAME}"
          poetry add "${DEP_NAME}"=="${VERSION}" --group main
          poetry add "${DEP_NAME}"=="${VERSION}" --group integration
          poetry update "${DEP_NAME}"

      - name: Commit changes
        working-directory: ${{ matrix.repo }}
        run: |
         git checkout -b "${PR_BRANCH}"
          git add pyproject.toml poetry.lock
          git commit -m "patch: Bump ${DEP_NAME} to version ${VERSION}"
          git push origin "${PR_BRANCH}"

      - name: Open Pull Request
        run: |
          gh pr create \
            --repo canonical/${{ matrix.repo }} \
            --title "patch: Bump ${DEP_NAME} to ${VERSION}" \
            --body "Automated bump of \`${DEP_NAME}\` to version \`${VERSION}\` after PyPI release." \
            --base ${{ env.BASE_BRANCH }}  \
            --head "${PR_BRANCH}"
