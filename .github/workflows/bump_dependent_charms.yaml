name: Bump dependent charm versions

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      base_branch:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
      base_branch:
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependent-charms:
    name: Open PRs in dependent charm repos
    runs-on: ubuntu-latest

    strategy:
      matrix:
        repo:
          - canonical/mongodb-operator
          #- canonical/mongodb-k8s-operator
          #- canonical/mongos-k8s-operator
          #- canonical/mongos-operator



    env:
      VERSION: ${{ inputs.version }}
      BASE_BRANCH: ${{ inputs.base_branch }}
      DEP_NAME: mongo-charms-single-kernel
      GH_TOKEN: ${{ secrets.PAT }}
      PR_BRANCH: "bump-mongo-charms-single-kernel-${{ inputs.version }}2"

    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ env.BASE_BRANCH }}
          token: ${{ secrets.PAT }}
      - run: |
          date > generated.txt
          # Note: the following account information will not work on GHES
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "generated"
          git push
