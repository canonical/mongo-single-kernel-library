name: Bump Mongo Single Kernel Lib in Charms

on:
  workflow_call:
    inputs:
      version:
        description: "Version to bump to (e.g. v1.8.22)"
        required: true
        type: string
      base_branch:
        description: "Target branch to create PR against (e.g. 8/edge)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Version to bump to (e.g. v1.8.22)"
        required: true
        type: string
      base_branch:
        description: "Target branch to create PR against (e.g. 8/edge)"
        required: true
        type: string

jobs:
  update-dependent-charms:
    name: Open PRs to bump Mongo Single Kernel lib in charm repos
    runs-on: ubuntu-latest

    strategy:
      matrix:
        repo:
          - canonical/mongodb-operator
          #- canonical/mongodb-k8s-operator
          #- canonical/mongos-k8s-operator
          #- canonical/mongos-operator

    permissions:
      contents: write
      pull-requests: write

    env:
      VERSION: ${{ inputs.version }}
      BASE_BRANCH: ${{ inputs.base_branch }}
      DEP_NAME: mongo-charms-single-kernel
      PR_BRANCH: "bump-mongo-charms-single-kernel-${{ inputs.version }}"

    steps:
      - name: Install CLI
        run: pipx install git+https://github.com/canonical/data-platform-workflows@v31.1.1#subdirectory=python/cli

      - name: Checkout mongo-single-kernel repo
        uses: actions/checkout@v6

      - name: Get new tag content
        run: |
          git fetch --tags
          PREV_TAG=$(git describe --tags --abbrev=0 "${VERSION}"^)
          VERSION_CONTENT=$(git log --pretty=format:"- %h %s" $PREV_TAG..${VERSION} | sed -E 's/\(#([0-9]+)\)/[#\1](https:\/\/github.com\/canonical\/mongo-single-kernel-library\/pull\/\1)/')

          # Write multiline env variable safely
          echo "VERSION_CONTENT<<EOF" >> $GITHUB_ENV
          echo "$VERSION_CONTENT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Checkout target repo
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ env.BASE_BRANCH }}
          token: ${{ secrets.PAT }}

      - name: Install tox & poetry
        run: |
          pipx ensurepath
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          pipx install tox poetry

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "poetry"

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y build-essential python3-dev libldap-dev libsasl2-dev

      - name: Update dependency version in pyproject.toml
        run: |
          poetry remove "${DEP_NAME}"
          VERSION_NUMBER="${VERSION#v}"
          poetry add "${DEP_NAME}"=="${VERSION_NUMBER}" --group main
          poetry add "${DEP_NAME}"=="${VERSION_NUMBER}" --group integration

      - name: Poetry update
        run: poetry update "${DEP_NAME}"

      - name: Commit changes
        run: |
          git config user.name "canonical-data-platform-bot"
          git config user.email "canonical-data-platform-bot@canonical.com"
          git checkout -b "${PR_BRANCH}"
          git add pyproject.toml poetry.lock
          git commit -m "Bump ${DEP_NAME} to version ${VERSION}"

      - name: Push branch
        run: |
          git push origin "${PR_BRANCH}" -f

      - name: Open Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
        run: |
          BODY="Automated bump of \`${DEP_NAME}\` to version \`${VERSION}\` after PyPI release.
            ### Included changes
            ${{ env.VERSION_CONTENT }}"

          gh pr create \
            --title "patch: Bump ${DEP_NAME} to ${VERSION}" \
            --body "${BODY}" \
            --base ${{ env.BASE_BRANCH }}  \
            --head "${PR_BRANCH}" \
            --reviewer Mehdi-Bendriss,Gu1nness,patriciareinoso
