name: Bump dependent charm versions

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      base_branch:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
      base_branch:
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependent-charms:
    name: Open PRs in dependent charm repos
    runs-on: ubuntu-latest

    strategy:
      matrix:
        repo:
          - canonical/mongodb-operator
          #- canonical/mongodb-k8s-operator
          #- canonical/mongos-k8s-operator
          #- canonical/mongos-operator

    env:
      VERSION: ${{ inputs.version }}
      BASE_BRANCH: ${{ inputs.base_branch }}
      DEP_NAME: mongo-charms-single-kernel
      GITHUB_TOKEN: ${{ secrets.PAT }}
      PR_BRANCH: "bump-mongo-charms-single-kernel-${{ inputs.version }}2"

    steps:
      - name: Install CLI
        run: |
          pipx install git+https://github.com/canonical/data-platform-workflows@v31.1.1#subdirectory=python/cli
          git config --global user.name "canonical-data-platform-bot"
          git config --global user.email "canonical-data-platform-bot@canonical.com"
          git config --global url.https://${{ secrets.PAT }}@github.com/.insteadOf https://github.com/
          if [ -z "${{ secrets.PAT }}" ]; then
            echo "PAT is empty"
            exit 1
          else
            echo "PAT is present"
          fi

      - name: Checkout target repo
        uses: actions/checkout@v6

      - name: Checkout target repo
        uses: actions/checkout@v5
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ env.BASE_BRANCH }}
          persist-credentials: false
          github-server-url: https://x-access-token:${{ secrets.PAT }}@github.com/${{ matrix.repo }}.git

      - name: Install tox & poetry
        run: |
          pipx ensurepath
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          pipx install tox poetry

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "poetry"

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y build-essential python3-dev libldap-dev libsasl2-dev

      - name: Create update branch
        run: |
          PR_BRANCH="bump-${DEP_NAME}-${VERSION}"
          git checkout -b "$PR_BRANCH"
          echo "PR_BRANCH=$PR_BRANCH" >> "$GITHUB_ENV"

      - name: Update dependency version in pyproject.toml
        run: |
          poetry remove "${DEP_NAME}"
          poetry add "${DEP_NAME}"=="${VERSION}" --group main
          poetry add "${DEP_NAME}"=="${VERSION}" --group integration

      - name: Poetry update
        run: poetry update "${DEP_NAME}"

      - name: Commit changes
        run: |
          git config --global user.name "canonical-data-platform-bot"
          git config --global user.email "canonical-data-platform-bot@canonical.com"
          git config --global url.https://${{ secrets.PAT }}@github.com/.insteadOf https://github.com/
          git add pyproject.toml poetry.lock
          git commit -m "Bump ${DEP_NAME} to version ${VERSION}"
          git push origin "${PR_BRANCH}" -f

      - name: Open Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
        run: |
          gh pr create \
            --title "patch: Bump ${DEP_NAME} to ${VERSION}" \
            --body "Automated bump of \`${DEP_NAME}\` to version \`${VERSION}\` after PyPI release." \
            --base ${{ env.BASE_BRANCH }}  \
            --head "${PR_BRANCH}"
