name: Bump dependent charm versions

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      base_branch:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
      base_branch:
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependent-charms:
    name: Open PRs in dependent charm repos
    runs-on: ubuntu-latest

    strategy:
      matrix:
        repo:
          - canonical/mongodb-operator
          #- canonical/mongodb-k8s-operator
          #- canonical/mongos-k8s-operator
          #- canonical/mongos-operator



    env:
      VERSION: ${{ inputs.version }}
      BASE_BRANCH: ${{ inputs.base_branch }}
      DEP_NAME: mongo-charms-single-kernel
      GH_TOKEN: ${{ secrets.PAT }}
      PR_BRANCH: "bump-mongo-charms-single-kernel-${{ inputs.version }}2"

    steps:
      - name: Install CLI
        run: pipx install git+https://github.com/canonical/data-platform-workflows@v31.1.1#subdirectory=python/cli

      - name: Checkout target repo
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ env.BASE_BRANCH }}

      #- name: Configure git
      #  run: |
      #    git config --global user.name "GitHub Actions"
      #    git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      #    git config --global url.https://${{ secrets.PAT }}@github.com/.insteadOf https://github.com/

      - name: Install tox & poetry
        run: |
          pipx ensurepath
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          pipx install tox poetry

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "poetry"

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y build-essential python3-dev libldap-dev libsasl2-dev

      - name: Update dependency version in pyproject.toml
        run: |
          poetry remove "${DEP_NAME}"
          poetry add "${DEP_NAME}"=="${VERSION}" --group main
          poetry add "${DEP_NAME}"=="${VERSION}" --group integration
          poetry update "${DEP_NAME}"


      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PAT }}
          branch: ${{ env.PR_BRANCH }}
          commit-message: "patch: Bump ${DEP_NAME} to version ${VERSION}"
          title: "patch: Bump ${DEP_NAME} to ${VERSION}"
          body: "Automated bump of ${DEP_NAME} to version ${VERSION} after PyPI release."
          base: ${{ env.BASE_BRANCH }}
        id: cpr
