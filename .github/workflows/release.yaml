name: Release to PyPI

on:
  push:
    branches:
      - 6/edge
      - 8-transition/edge
      - 8/edge

concurrency:
  # Prevent race conditions (if multiple commits have been pushed since the last release)
  group: dpw-release-python-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-quick-tests:
    uses: ./.github/workflows/ci-quick.yaml
    permissions:
      pull-requests: write
    secrets: inherit

  ci-tests:
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: write # Needed for Allure Report
    secrets: inherit

  release-part1:
    needs:
      - ci-quick-tests
      - ci-tests
    name: Release to PyPI (part 1)
    uses: canonical/data-platform-workflows/.github/workflows/release_python_package_part1.yaml@v50.2.1
    permissions:
      contents: write # Needed to create git tag

  # Separate job needed to workaround https://github.com/pypi/warehouse/issues/11096
  release-trusted-publishing:
    name: Release to PyPI (trusted publishing)
    needs:
      - release-part1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.release-part1.outputs.artifact-name }}
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1.14.2 # This is an immutable release
    permissions:
      id-token: write # Needed for PyPI trusted publishing

  release-part2:
    name: Release to PyPI (part 2)
    needs:
      - release-part1
      - release-trusted-publishing
    uses: canonical/data-platform-workflows/.github/workflows/release_python_package_part2.yaml@v50.2.1
    with:
      git-tag: ${{ needs.release-part1.outputs.git-tag }}
    permissions:
      contents: write # Needed to create GitHub release

  wait-for-pypi-available:
    name: Wait for PyPI release to be available
    runs-on: ubuntu-latest
    needs:
      - release-part1
      - release-part2
    steps:
      - name: Wait for PyPI release to be available
        run: |
          set -euo pipefail
          TAG="${{ needs.release-part1.outputs.git-tag }}"
          DEP_NAME="mongo-charms-single-kernel"
          VERSION_NUMBER="${TAG#v}"
          URL="https://pypi.org/pypi/${DEP_NAME}/${VERSION_NUMBER}/json"

          echo "Waiting for ${DEP_NAME}==${VERSION_NUMBER} to be available on PyPI..."
          for i in {1..30}; do
            if curl -fsS "$URL" >/dev/null; then
              echo "Found ${DEP_NAME}==${VERSION_NUMBER} on PyPI."
              exit 0
            fi
            echo "Not yet available (attempt $i/30). Sleeping..."
            sleep 60
          done

          echo "Timed out waiting for ${DEP_NAME}==${VERSION_NUMBER} on PyPI."
          exit 1
    permissions:
      contents: read

  trigger-bump-dependent-charms:
    name: Trigger bump-dependent-charms workflow
    needs:
      - release-part1
      - release-part2
      - wait-for-pypi-available
    uses: ./.github/workflows/bump_dependent_charms.yaml
    with:
      version: ${{ needs.release-part1.outputs.git-tag }}
      base_branch: ${{ github.ref_name }}
    permissions: # Needed to create PRs in dependent charm repos
      contents: write
      pull-requests: write
    secrets: inherit
