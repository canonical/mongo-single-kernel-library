type: charm
platforms:
  ubuntu@22.04:amd64:
parts:
  charm:
    charm-strict-dependencies: true
    override-build: |
      rustup default stable
      craftctl default
    build-snaps:
      - rustup
    build-packages:
      - git
      - build-essential
      - libffi-dev
      - libssl-dev
      - pkg-config
      - rustc
      - cargo
  files:
    plugin: dump
    source: .
    prime:
      - LICENSE
      - charm_version
      - workload_version
