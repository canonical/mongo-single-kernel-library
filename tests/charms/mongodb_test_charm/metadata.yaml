name: mongodb
display-name: Test MongoDB
description: |
  Test charm for MongoDB single kernel.
docs: https://discourse.charmhub.io/t/charmed-mongodb-6-docs/12461
source: https://github.com/canonical/mongodb-operator
issues: https://github.com/canonical/mongodb-operator/issues
website:
  - https://ubuntu.com/data/mongodb
  - https://charmhub.io/mongodb
  - https://github.com/canonical/mongodb-operator
  - https://chat.charmhub.io/charmhub/channels/data-platform
summary: A Test MongoDB operator charm
series:
  - noble

storage:
  archive:
    type: filesystem
    location: /var/snap/charmed-mongodb/common/archive
    description: storage for local backup files.
  data:
    type: filesystem
    location: /var/snap/charmed-mongodb/common/var/lib/mongodb
    description: storage for MongoDB data.
  logs:
    type: filesystem
    location: /var/snap/charmed-mongodb/common/var/log/mongodb
    description: storage for logfiles.
  temp:
    type: filesystem
    location: /tmp
    description: Storage mount used for storing temporary tablespaces.

provides:
  database:
    interface: mongodb_client
  cos-agent:
    interface: cos_agent
  config-server:
    interface: shards
  cluster:
    interface: config-server

peers:
  database-peers:
    interface: mongodb-peers
  status-peers:
    interface: status-peers
  ldap-peers:
    # Stores the data for the ldap relation.
    interface: ldap-peers
  refresh-v-three:
    # Relation versioning scheme: https://canonical-charm-refresh.readthedocs-hosted.com/latest/
    interface: refresh
  rollingops-peers:
    interface: rollingops-peers

requires:
  s3-credentials:
    interface: s3
    limit: 1
  gcs-credentials:
    interface: gcs
    limit: 1
  peer-certificates:
    interface: tls-certificates
    limit: 1
    optional: true
  client-certificates:
    interface: tls-certificates
    limit: 1
    optional: true
  sharding:
    interface: shards
    # shards can only relate to one config-server
    limit: 1
  ldap:
    interface: ldap
    limit: 1
    optional: true
  ldap-certificate-transfer:
    interface: certificate_transfer
    limit: 1
    optional: true
  etcd:
    interface: etcd_client
  vault-kv:
    interface: vault-kv
    limit: 1
    optional: true
