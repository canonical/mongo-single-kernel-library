summary: test_ha.py
environment:
  TEST_MODULE: test_ha.py
execute: |
  tox run -e integration -- "tests/integration/mongodb/ha/$TEST_MODULE" --substrate microk8s --model testing --alluredir="$SPREAD_TASK/allure-results" --keep-models 
artifacts:
  - allure-results
systems:
  - ubuntu-22.04
  - ubuntu-22.04-arm
