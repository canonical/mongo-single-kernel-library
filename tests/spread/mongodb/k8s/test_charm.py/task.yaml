summary: test_charm.py
environment:
  TEST_MODULE: test_charm.py
execute: |
  tox run -e integration -- "tests/integration/mongodb/$TEST_MODULE" --substrate k8s --model testing --alluredir="$SPREAD_TASK/allure-results" --keep-models
artifacts:
  - allure-results
systems:
  - self-hosted-linux-amd64-noble-large
  - ubuntu-24.04-arm
