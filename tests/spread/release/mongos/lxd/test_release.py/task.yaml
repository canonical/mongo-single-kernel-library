summary: test_release.py
environment:
  TEST_MODULE: test_release.py
execute: |
  tox run -e integration -- "tests/integration/mongos/release/$TEST_MODULE" --substrate lxd --model testing --mongodb-revision $MONGODB_REVISION --mongos-revision $MONGOS_REVISION"
systems:
  - ubuntu-22.04
  - ubuntu-22.04-arm
