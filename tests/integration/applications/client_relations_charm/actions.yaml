write-releases:
  description: Write the data of a few ubuntu releases in the database.
  params:
    database:
      type: string
      description: The DB name

create-user:
  description: Creates a user in the database.
  params:
    database:
      type: string
      description: The DB name
    username:
      type: string
      description: The user name
    password:
      type: string
      description: The user password
