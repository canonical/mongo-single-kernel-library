options:
  ldap-group-dn:
    type: string
    default: "ou=superheroes,ou=users,dc=glauth,dc=com"
    description: Name of the GROUP entity (LDAP group DN) requested on the ldap-group endpoint.
  ldap-group-database:
    type: string
    default: superdb
    description: Database the group roles apply to.
  ldap-group-roles:
    type: string
    default: default
    description: extra-group-roles sent with the GROUP request.
  ldap-group-permissions:
    type: string
    default: ""
    description: entity-permissions JSON sent with the GROUP request (empty for none).
