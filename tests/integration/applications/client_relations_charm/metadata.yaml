name: application
description: |
  Data platform libs application charm used in integration tests.
summary: |
  Data platform libs application meant to be used
  only for testing of the libs in this repository.

requires:
  first-database:
    interface: mongodb_client
  second-database:
    interface: mongodb_client
  multiple-database-clusters:
    interface: mongodb_client
  aliased-multiple-database-clusters:
    interface: mongodb_client
    limit: 2
  ldap-group:
    interface: mongodb_client
    limit: 1

provides:
  # The same GROUP request towards a VM mongos: the subordinate's `mongos_proxy` endpoint
  # requires `mongos_client`, so the principal provides it (like the mongos client charm).
  ldap-group-mongos:
    interface: mongos_client
    limit: 1
