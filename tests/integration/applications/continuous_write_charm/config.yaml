options:
  mongos-uri:
    type: string
    description: |
      URI provided to connect to MongoDB cluster via mongos.
  tls-ca:
    type: string
    description: |
      TLS CA certificate to use alongside mongos-uri.
  database-name:
    type: string
    description: |
      Database name to request.
  external-connectivity:
    type: boolean
    description: |
      External connectivity for mongos.
    default: true
