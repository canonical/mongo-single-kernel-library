name: test-mongodb-k8s
display-name: Test MongoDB
description: |
  Test charm for MongoDB single kernel.
docs: https://discourse.charmhub.io/t/charmed-mongodb-6-docs/12461
source: https://github.com/canonical/mongodb-operator
issues: https://github.com/canonical/mongodb-operator/issues
website:
  - https://ubuntu.com/data/mongodb
  - https://charmhub.io/mongodb
  - https://github.com/canonical/mongodb-operator
  - https://chat.charmhub.io/charmhub/channels/data-platform
summary: A Test MongoDB operator charm

assumes:
  - k8s-api


storage:
  mongodb:
    type: filesystem
    location: /var/lib/mongodb
  mongodb-logs:
    type: filesystem
    location: /var/log/mongodb

containers:
  mongod:
    resource: mongodb-image
    mounts:
      - storage: mongodb
        location: /var/lib/mongodb

provides:
  database:
    interface: mongodb_client
  cos-agent:
    interface: cos_agent
  config-server:
    interface: shards
  cluster:
    interface: config-server

peers:
  database-peers:
    interface: mongodb-peers

requires:
  s3-credentials:
    interface: s3
    limit: 1
  certificates:
    interface: tls-certificates
    limit: 1
  sharding:
    interface: shards
    # shards can only relate to one config-server
    limit: 1

resources:
  mongodb-image:
    type: oci-image
    description: OCI image for mongodb
    # TODO: Update sha whenever upstream rock changes
    upstream-source: ghcr.io/canonical/charmed-mongodb@sha256:b4b3edb805b20de471da57802643bfadbf979f112d738bc540ab148d145ddcfe
