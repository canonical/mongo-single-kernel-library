name: mongos
title: Mongos
base: core24 # the base snap is the execution environment for this snap
version: "8.0.10-4" # just for humans, typically '1.2+git' or '1.3.2'
summary: Mongos in a snap. # 79 char long summary
description: |
  Mongos is the MongoDB sharded cluster query router.
  This snap packages the mongos daemon and related client
  utilities into a self-contained, strictly confined Ubuntu snap.

license: Apache-2.0
grade: stable # must be 'stable' to release into candidate/stable channels
confinement: strict
platforms:
  amd64:
  arm64:

website: https://github.com/canonical/mongodb-artifacts
contact: https://github.com/canonical/mongodb-artifacts/issues/new
issues: https://github.com/canonical/mongodb-artifacts/issues/new

system-usernames:
  snap_daemon: shared

hooks:
  install:
    plugs:
      - network
      - network-bind

package-repositories:
  - type: apt
    components: [main]
    suites: [noble]
    key-id: 6676E3F1A76ADBE4488944BF7D1A96D4BF78C79E
    url: https://ppa.launchpadcontent.net/data-platform/charmed-mongodb-8/ubuntu
  - type: apt
    components: [main]
    suites: [noble]
    key-id: 6676E3F1A76ADBE4488944BF7D1A96D4BF78C79E
    url: |
        https://ppa.launchpadcontent.net/data-platform/mongodb-shell/ubuntu

slots:
  logs:
    interface: content
    source:
      read:
        - $SNAP_COMMON/var/log/mongos

apps:
  get-keyfile:
    command: get-keyfile.sh
  set-keyfile:
    command: set-keyfile.sh
  mongosh:
    command: drop_priv.sh mongosh
    plugs:
      - network
  mongos:
    daemon: simple
    install-mode: disable
    command: start-mongos.sh
    restart-condition: always
    restart-delay: 20s
    plugs:
      - network
      - network-bind
    slots:
      - logs
  # MongoDB Tools
  mongodump:
    command: drop_priv.sh mongodump
    plugs:
      - network
      - network-bind
  mongoexport:
    command: drop_priv.sh mongoexport
  mongofiles:
    command: drop_priv.sh mongofiles
  mongoimport:
    command: drop_priv.sh mongoimport
  mongorestore:
    command: drop_priv.sh mongorestore
    plugs:
      - network
      - network-bind

  mongostat:
    command: drop_priv.sh mongostat
  mongotop:
    command: drop_priv.sh mongotop

parts:
  mongos-license:
    plugin: nil
    stage-packages:
      - percona-server-mongodb
    override-prime: |
      mkdir -p $CRAFT_PRIME/licenses
      LICENSE_LOC=usr/share/doc/percona-server-mongodb
      zcat $CRAFT_STAGE/$LICENSE_LOC/LICENSE-Community.txt.gz \
        > $CRAFT_PRIME/licenses/LICENSE-percona-server
    prime:
      - licenses/LICENSE-percona-server
  mongos-conf:
    plugin: nil
    stage-packages:
      - percona-server-mongodb-server
    prime:
      - etc/mongod.conf
  mongos-deb:
    plugin: nil
    stage-packages:
      - percona-server-mongodb-mongos
      - percona-server-mongodb-tools
      - mongodb-shell
      - util-linux
      - openssl
    stage-snaps:
      - yq
    organize:
      usr/share/doc/mongodb-shell/copyright:
        licenses/LICENSE-mongodb-shell
  wrapper:
    plugin: dump
    source: snap/local
  snap-license:
    plugin: dump
    source: .
    source-type: local
    stage:
      - licenses/LICENSE-snap
    organize:
      LICENSE: licenses/LICENSE-snap
