#
# This file defines the configuration for concierge.
# Concierge (https://github.com/jnsgruk/concierge) is a utility used to
# provision charm development and testing machines.
# This file is used automatically by spread.
juju:
  model-defaults:
    logging-config: <root>=INFO; unit=DEBUG
providers:
  k8s:
    enable: true
    bootstrap: true
    channel: 1.35-classic/stable
    bootstrap-constraints:
      root-disk: 5G

host:
  snaps:
    jhack:
      channel: latest/edge
      connections:
        - jhack:dot-local-share-juju snapd
